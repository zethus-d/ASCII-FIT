:root{--bg:#000;--fg:#ff7a1a;--dim:#7f3d0d;--grid:rgba(255,122,26,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--fg);font:13px/1.3 "JetBrains Mono","JBM Nerd",ui-monospace,monospace;letter-spacing:.04em;overflow-x:hidden}
#app{max-width:420px;margin:0 auto;padding:14px 14px 28px;min-height:100%;display:flex;flex-direction:column;gap:12px}
pre{margin:0;font:inherit;letter-spacing:inherit}
.top{display:flex;justify-content:space-between;color:var(--dim)}

(async()=>{try{if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return pfb(b,'DONE','EXPORT')}}catch(x){if(x&&x.name==='AbortError')return}
try{const u=URL.createObjectURL(fl),l=document.createElement('a');l.href=u;l.download=fl.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);pfb(b,'SAVED','EXPORT')}
catch(x){try{await navigator.clipboard.writeText(t);pfb(b,'COPIED','EXPORT')}catch(y){pfb(b,'FAILED','EXPORT')}}})();break}
case'p_cp':{const st=load();if(!st.plan)return;navigator.clipboard.writeText(p2t(st.plan)).then(()=>pfb(b,'COPIED','COPY'),()=>pfb(b,'FAILED','COPY'));break}
case'p_imp':{const x=$('#pfi');x&&x.click();break}

app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.id==='pdn'){e.preventDefault();pdAdd()}else if(t.dataset&&t.dataset.pa){e.preventDefault();pAdd(t.dataset.pa,t.value)}});

/* circuit background */
const BGc=document.createElement('canvas');BGc.id='bgc';document.body.insertBefore(BGc,document.body.firstChild);
let BL=1;try{const v=localStorage.getItem('asciifit.b');if(v!==null&&+v>=0&&+v<=2)BL=+v}catch(e){}const bgop=()=>{BGc.style.opacity=[0,.28,.55][BL]};bgop();
let BP=[],BU=[],BCH=[],BO=null,BW=0,BH=0,BCol='',bgT=0;
function bgGen(){const g=24,w=BW=innerWidth,h=BH=innerHeight;BGc.width=w;BGc.height=h;const cl=Math.floor(w/g),rw=Math.floor(h/g),dirs=[[1,0],[0,1],[-1,0],[0,-1]],P=[];
for(let n=0,N=Math.max(12,Math.round(cl*rw/26));n<N;n++){let x=Math.random()*cl|0,y=Math.random()*rw|0,d=Math.random()*4|0;const pts=[[x*g,y*g]];
for(let k=0,m=4+Math.random()*5;k<m;k++){let len=2+Math.random()*7|0,dx,dy;
if(Math.random()<.22){dx=Math.random()<.5?1:-1;dy=Math.random()<.5?1:-1;len=1+Math.random()*3|0}else{dx=dirs[d][0];dy=dirs[d][1];d=(d+(Math.random()<.5?1:3))%4}
const nx=x+dx*len,ny=y+dy*len;if(nx<0||ny<0||nx>cl||ny>rw)break;x=nx;y=ny;pts.push([x*g,y*g])}
if(pts.length>2)P.push(pts)}
BP=P.map(pts=>{const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,len:cum[cum.length-1]}});
BU=[];BP.forEach(p=>{for(let i=0,k=p.len>260?2:1;i<k;i++)BU.push({p,d:-Math.random()*p.len*1.5,v:80+Math.random()*170})});
BCH=Array.from({length:Math.max(2,cl*rw/160|0)},()=>[(Math.random()*Math.max(1,cl-5)|0)*g,(Math.random()*Math.max(1,rw-4)|0)*g,(3+Math.random()*2|0)*g,(2+Math.random()*2|0)*g]);BO=null}
function bgBase(C){BO=BO||document.createElement('canvas');BO.width=BW;BO.height=BH;const o=BO.getContext('2d');o.strokeStyle=C.fg;o.fillStyle=C.fg;o.lineWidth=1;
o.globalAlpha=.2;for(const p of BP){o.beginPath();p.pts.forEach((q,i)=>i?o.lineTo(q[0],q[1]):o.moveTo(q[0],q[1]));o.stroke()}
o.globalAlpha=.35;for(const p of BP){p.pts.slice(1,-1).forEach(q=>o.fillRect(q[0]-1.5,q[1]-1.5,3,3));for(const q of[p.pts[0],p.pts[p.pts.length-1]]){o.beginPath();o.arc(q[0],q[1],3.5,0,6.3);o.stroke()}}
o.globalAlpha=.22;for(const q of BCH){o.strokeRect(q[0],q[1],q[2],q[3]);for(let x=q[0]+8;x<q[0]+q[2];x+=12){o.fillRect(x,q[1]-4,1,4);o.fillRect(x,q[1]+q[3],1,4)}}o.globalAlpha=1}
function bgPos(p,d){let i=1;while(i<p.cum.length-1&&p.cum[i]<d)i++;const a=p.pts[i-1],b=p.pts[i],u=(d-p.cum[i-1])/((p.cum[i]-p.cum[i-1])||1);return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]}
function bgFrame(t){requestAnimationFrame(bgFrame);if(!BL)return;if(innerWidth!==BW||Math.abs(innerHeight-BH)>60)bgGen();const C=col(t);if(!BO||BCol!==C.fg){BCol=C.fg;bgBase(C)}
const dt=Math.min(.05,(t-bgT)/1000),sp=RM?0:R?(R.steps[R.s].t==='work'?2.4:.8):1,c=BGc.getContext('2d');bgT=t;c.clearRect(0,0,BW,BH);c.drawImage(BO,0,0);if(!sp)return;c.fillStyle=C.fg;
for(const u of BU){u.d+=u.v*sp*dt;if(u.d>u.p.len+90){u.d=-Math.random()*200;u.v=80+Math.random()*170}
for(let k=0;k<10;k++){const d=u.d-k*7;if(d<0||d>u.p.len)continue;const q=bgPos(u.p,d);c.globalAlpha=k?(1-k/10)*.6:1;const z=k?2:3;c.fillRect(q[0]-z/2,q[1]-z/2,z,z)}
if(u.d>=0&&u.d<=u.p.len){const q=bgPos(u.p,u.d);c.globalAlpha=.22;c.beginPath();c.arc(q[0],q[1],6,0,6.3);c.fill()}}c.globalAlpha=1}
bgGen();
function impj(t){try{const o=JSON.parse(t);let n=0;for(const k in o)if(k.startsWith('asciifit')&&typeof o[k]==='string'){localStorage.setItem(k,o[k]);n++}if(n){location.reload();return 1}}catch(x){}return 0}
app.addEventListener('change',e=>{const id=e.target.id;if(id==='hh'||id==='ww'){const st=load();if(!st.prof)return;const v=+e.target.value,ok=id==='hh'?(v>=120&&v<=230):(v>=30&&v<=250);if(ok){st.prof[id==='hh'?'h':'w']=v;if(id==='ww')wlogAdd(st,v);save(st)}else{e.target.value=st.prof[id==='hh'?'h':'w'];e.target.style.borderColor='red';setTimeout(()=>{e.target.style.borderColor=''},900)}return}if(id!=='fi'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>impj(r.result);r.readAsText(e.target.files[0])});
function loop(t){requestAnimationFrame(loop);nart(t);cur&&cur(t);lrnDraw(t);if(t-hxT>60){hxT=t;const h=document.getElementById('hx');if(h)h.textContent=hexline()}if(t-tlT>100){tlT=t;const l=document.getElementById('tlog');if(l){TL.push(tline());while(TL.length>(+l.dataset.n||5))TL.shift();l.textContent=TL.join('\n')}}}
requestAnimationFrame(loop);requestAnimationFrame(bgFrame);
boot();
